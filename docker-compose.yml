services:
  traefik:
    image: "traefik"
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command:
      - "--api.insecure=true"
      - "--log.level=DEBUG"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.permanent=true"
      #- "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      #- "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.httpChallenge=true"           # changed
      - "--certificatesresolvers.mytlschallenge.acme.httpChallenge.entryPoint=web" # add this
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # - /docker/n8n/n8n-files:/data
  
  fastapi:
    build: ./mechanic-shop/server
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.leetcodetutor.com`)
      - traefik.http.routers.api.entrypoints=websecure,web
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.tls.certresolver=mytlschallenge
      - traefik.http.services.api.loadbalancer.server.port=8000
    networks:
      - default
  
  frontend:
    build: ./mechanic-shop/client
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`app.leetcodetutor.com`)
      - traefik.http.routers.frontend.entrypoints=websecure,web
      - traefik.http.routers.n8n.entrypoints=websecure,web
      - traefik.http.routers.frontend.tls.certresolver=mytlschallenge
      - traefik.http.services.frontend.loadbalancer.server.port=80
    networks:
      - default

  n8n:
    image: docker.n8n.io/n8nio/n8n
    # container_name: n8n-n8n-1
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - NODES_EXCLUDE=[]
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_RUNNERS_ENABLED=true
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_PROXY_HOPS=1
      #- N8N_BASIC_AUTH_ACTIVE=true
      #- N8N_BASIC_AUTH_USER=malk_777@outlook.com
    volumes:
      - /docker/n8n/n8n-files:/data
      - /local-files:/files

volumes:
  traefik_data:
    external: true
  n8n_data:
    external: true
